<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}Siry シリー</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}" />{% endif %}
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
</head>
<body class="site">
  <div class="wrap {{ page.page_class }}">
    {% include site-header.html %}
    {{ content }}
    {% include site-footer.html %}
  </div>

  <div id="lightbox" class="lightbox">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <img alt="" />
  </div>

  <script>
    (function(){
      var root=document.documentElement;
      var btn=document.getElementById('themeToggle');
      if(btn) btn.addEventListener('click',function(){
        var isDark=root.getAttribute('data-theme')==='dark'||
          (!root.hasAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches);
        var next=isDark?'light':'dark';
        root.setAttribute('data-theme',next);
        try{localStorage.setItem('theme',next);}catch(e){}
      });

      document.querySelectorAll('[data-shots]').forEach(function(box){
        var tabs=[].slice.call(box.querySelectorAll('.shots-tab'));
        var dots=[].slice.call(box.querySelectorAll('.shots-dot'));
        var track=box.querySelector('.shots-track');
        var slides=[].slice.call(box.querySelectorAll('.shots-track img'));
        var prevs=[].slice.call(box.querySelectorAll('[data-prev]'));
        var nexts=[].slice.call(box.querySelectorAll('[data-next]'));
        var countEl=box.querySelector('.shots-count');
        var labelEl=box.querySelector('.shots-label');
        var total=slides.length;
        if(!track||!total) return;
        var pad=function(n){return (n<10?'0':'')+n;};
        var i=0;

        function place(){
          if(!slides[i]) return;
          track.style.transform='translateX(-'+(slides[i].offsetLeft-slides[0].offsetLeft)+'px)';
        }
        function go(n,animate){
          i=Math.max(0,Math.min(total-1,n));
          if(animate===false){track.style.transition='none';}
          tabs.forEach(function(t,k){t.classList.toggle('is-active',k===i);t.setAttribute('aria-selected',k===i?'true':'false');});
          dots.forEach(function(d,k){d.classList.toggle('is-active',k===i);});
          slides.forEach(function(s,k){s.classList.toggle('is-active',k===i);});
          prevs.forEach(function(b){b.disabled=(i===0);});
          nexts.forEach(function(b){b.disabled=(i===total-1);});
          if(countEl) countEl.textContent=pad(i+1)+' / '+pad(total);
          if(labelEl) labelEl.textContent=(tabs[i]&&tabs[i].dataset.label)||'';
          place();
          if(animate===false){void track.offsetWidth;track.style.transition='';}
        }

        tabs.forEach(function(t,k){t.addEventListener('click',function(){go(k);});});
        dots.forEach(function(d,k){d.addEventListener('click',function(){go(k);});});
        prevs.forEach(function(b){b.addEventListener('click',function(){go(i-1);});});
        nexts.forEach(function(b){b.addEventListener('click',function(){go(i+1);});});

        // swipe
        var x0=null;
        box.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
        box.addEventListener('touchend',function(e){
          if(x0===null) return;
          var dx=e.changedTouches[0].clientX-x0;
          x0=null;
          if(Math.abs(dx)>40) go(dx<0?i+1:i-1);
        });

        window.addEventListener('resize',function(){go(i,false);});
        slides.forEach(function(s){
          if(!s.complete) s.addEventListener('load',function(){go(i,false);});
        });
        go(0,false);
      });

      document.querySelectorAll('[data-top]').forEach(function(a){
        a.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});
      });

      var lb=document.getElementById('lightbox'),big=lb.querySelector('img');
      function open(s,a){big.src=s;big.alt=a||'';lb.classList.add('is-open');document.body.style.overflow='hidden';}
      function close(){lb.classList.remove('is-open');document.body.style.overflow='';big.src='';}
      document.querySelectorAll('.fig img,.cs-cover img').forEach(function(img){
        img.style.cursor='zoom-in';
        img.addEventListener('click',function(){open(img.currentSrc||img.src,img.alt);});
      });
      lb.querySelector('.lightbox-close').addEventListener('click',close);
      lb.addEventListener('click',function(e){if(e.target===lb)close();});
      document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
    })();
  </script>
  {{ page.scripts }}
</body>
</html>
